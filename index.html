<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <link rel="icon" type="image/jpeg" href="/src/assets/bow.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study Timer</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div class="frame">
      <img class="frame-bg" src="/src/assets/app-frame.png" alt="Study Timer" draggable="false" />

      <div class="titlebar-drag" data-tauri-drag-region></div>

      <button id="win-minimize" class="win-btn win-btn-minimize" aria-label="Minimize"></button>
      <button id="win-maximize" class="win-btn win-btn-maximize" aria-label="Maximize"></button>
      <button id="win-close" class="win-btn win-btn-close" aria-label="Close"></button>

      <main class="content">
        <button id="hamburger-btn" class="hamburger-btn" aria-label="Menu">&#9776;</button>
        <div id="hamburger-menu" class="hamburger-menu hidden">
          <button id="vault-btn">Choose vault folder</button>
          <p id="vault-path">No vault chosen</p>
          <label><input type="checkbox" id="auto-commit" /> Auto-commit</label>
          <label><input type="checkbox" id="auto-push" /> Auto-push</label>
          <label><input type="checkbox" id="always-on-top" /> Always on top</label>
        </div>

        <div id="timer-display">00:00:00</div>
        <button id="toggle-btn">START STUDYING</button>
        <p id="today-total">Today: 0h 00m</p>
        <ul id="session-list"></ul>
      </main>
    </div>
  </body>
</html>
